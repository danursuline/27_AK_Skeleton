plugins {
    id "java"
    id "application"
    id "org.wpilib.GradleRIO" version "2027.0.0-alpha-7"
    id "com.peterabeles.gversion" version "1.10"
    id "com.diffplug.spotless" version "8.6.0"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

def ROBOT_MAIN_CLASS = "first.Main"

// Define my targets (SystemCore) and artifacts (deployable files)
// This is added by GradleRIO's backing project DeployUtils.
deploy {
    targets {
        systemcore(getTargetTypeClass('SystemCore')) {
            // Team number is loaded either from the .wpilib/wpilib_preferences.json
            // or from command line. If not found an exception will be thrown.
            // You can use getTeamOrDefault(team) instead of getTeamNumber if you
            // want to store a team number in this file.
            team = project.wpilib.getTeamNumber()
            // Use the default systemcore host name. This must be called after setting team
            // as happens on the line above
            useDefaultSystemcoreHostName()
            debug = project.wpilib.getDebugOrDefault(false)

            artifacts {
                // First part is artifact name, 2nd is artifact type
                // getTargetTypeClass is a shortcut to get the class type using a string

                wpilibJava(getArtifactTypeClass('WPILibJavaArtifact')) {
                    // Set to true to use debug including JNI, which will drastically impact performance.
                    debugJni = false
                }

                // Static files artifact
                wpilibStaticFileDeploy(getArtifactTypeClass('FileTreeArtifact')) {
                    files = project.fileTree('src/main/deploy')
                    directory = '/home/systemcore/deploy'
                    deleteOldFiles = false // Change to true to delete files on systemcore that no
                    // longer exist in deploy directory of this project
                }
            }
        }
    }
}

def deployArtifact = deploy.targets.systemcore.artifacts.wpilibJava

// Set to true to use debug for simulation including JNI
wpi.java.runSimWithDebugJni = false

// Set this to true to enable desktop support.
def includeDesktopSupport = true

// Configuration for AdvantageKit
task(replayWatch, type: JavaExec) {
    mainClass = "org.littletonrobotics.junction.ReplayWatch"
    classpath = sourceSets.main.runtimeClasspath
}

// Defining my dependencies. In this case, WPILib (+ friends), and vendor libraries.
// Also defines JUnit 5.
dependencies {
    annotationProcessor wpi.java.deps.wpilibAnnotations()
    implementation wpi.java.deps.wpilib()
    implementation wpi.java.vendor.java()

    systemcoreDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.systemcore)
    systemcoreDebug wpi.java.vendor.jniDebug(wpi.platforms.systemcore)

    systemcoreRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.systemcore)
    systemcoreRelease wpi.java.vendor.jniRelease(wpi.platforms.systemcore)

    nativeDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.desktop)
    nativeDebug wpi.java.vendor.jniDebug(wpi.platforms.desktop)
    simulationDebug wpi.sim.enableDebug()

    nativeRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.desktop)
    nativeRelease wpi.java.vendor.jniRelease(wpi.platforms.desktop)
    simulationRelease wpi.sim.enableRelease()

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    def akitJson = new groovy.json.JsonSlurper().parseText(new File(projectDir.getAbsolutePath() + "/vendordeps/AdvantageKit.json").text)
    annotationProcessor "org.littletonrobotics.akit:akit-autolog:$akitJson.version"
}

test {
    useJUnitPlatform()
    // Robot/AdvantageKit/HAL singletons must not leak between integration-test classes.
    forkEvery = 1
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
}

// Simulation configuration (e.g. environment variables).
//
// The sim GUI is *disabled* by default to support running
// AdvantageKit log replay, which requires that all HAL
// sim extensions be disabled.
wpi.sim.addGui().defaultEnabled = false
wpi.sim.addDriverstation()

application.mainClass = ROBOT_MAIN_CLASS

deployArtifact.configureApplication(application)
wpi.java.configureApplication(application)
wpi.java.configureTestTasks(test)

jar {
    from('src') { into 'backup/src' }
    from('vendordeps') { into 'backup/vendordeps' }
    from('build.gradle') { into 'backup' }
}

// Configure string concat to always inline compile
tasks.withType(JavaCompile) {
    options.compilerArgs.add '-XDstringConcat=inline'
}

// T09: bind deployed logs to the exact packaged source, including dirty edits.
// Generated identity is outside src so it cannot hash itself.
def hubIdentityDir = layout.buildDirectory.dir('generated/testhub/resources')
// gversion's BuildConstants.java embeds the build time, so it is excluded to keep hashes stable.
def hubIdentityGenerated = '**/BuildConstants.java'
def hubIdentityInputs = files(fileTree('src/main') { exclude hubIdentityGenerated }, fileTree('vendordeps'),
file('build.gradle'), file('settings.gradle'), file('gradle/wrapper/gradle-wrapper.properties'),
file('.wpilib/wpilib_preferences.json'))
def generateHubBuildIdentity = tasks.register('generateHubBuildIdentity') {
    inputs.files(hubIdentityInputs)
    outputs.file(hubIdentityDir.map { it.file('testhub-build.properties') })
    outputs.upToDateWhen { false } // Git commit/dirty metadata must refresh even with unchanged bytes.
    mustRunAfter(createVersionFile, spotlessApply) // Hash sources after formatting rewrites them.
    doLast {
        def digestFiles = { collection ->
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            collection.files.findAll { it.isFile() }.sort { a, b ->
                project.relativePath(a) <=> project.relativePath(b)
            }.each { source ->
                def path = project.relativePath(source).replace('\\', '/').getBytes('UTF-8')
                def bytes = source.bytes
                digest.update(java.nio.ByteBuffer.allocate(4).putInt(path.length).array())
                digest.update(path)
                digest.update(java.nio.ByteBuffer.allocate(8).putLong(bytes.length).array())
                digest.update(bytes)
            }
            java.util.HexFormat.of().formatHex(digest.digest())
        }
        def git = { arguments ->
            try {
                def result = providers.exec {
                    commandLine(['git'] + arguments)
                    ignoreExitValue = true
                }
                result.result.get().exitValue == 0 ? result.standardOutput.asText.get().trim() : 'unavailable'
            } catch (Exception ignored) {
                'unavailable'
            }
        }
        def versions = new TreeMap<String, String>()
        versions.put('WPILib', '2027.0.0-alpha-7')
        versions.put('Java', System.getProperty('java.version'))
        fileTree('vendordeps').matching { include '*.json' }.files.each { manifest ->
            def vendor = new groovy.json.JsonSlurper().parse(manifest)
            versions.put(vendor.name.toString(), vendor.version.toString())
        }
        def identity = new Properties()
        identity.setProperty('project_name', project.name)
        identity.setProperty('build_utc', java.time.Instant.now().toString())
        identity.setProperty('git_sha', git(['rev-parse', 'HEAD']))
        identity.setProperty('git_branch', git([
            'rev-parse',
            '--abbrev-ref',
            'HEAD'
        ]))
        def dirty = git([
            'status',
            '--porcelain',
            '--untracked-files=normal'
        ])
        identity.setProperty('git_dirty', dirty == 'unavailable' ? 'unavailable' : Boolean.toString(!dirty.isEmpty()))
        identity.setProperty('source_sha256', digestFiles(hubIdentityInputs))
        identity.setProperty('config_sha256', digestFiles(files(fileTree('src/main/java') { exclude hubIdentityGenerated }, fileTree('src/main/deploy'), fileTree('vendordeps'))))
        identity.setProperty('library_versions', groovy.json.JsonOutput.toJson(versions))
        identity.setProperty('snapshot_reference', 'application JAR: backup/src, backup/vendordeps, backup/build.gradle, backup/settings.gradle, backup/gradle, backup/.wpilib')
        identity.setProperty('artifact_hash_reference', 'build/reports/testhub/artifact-sha256.txt (external sidecar; not embedded in its own JAR)')
        def output = hubIdentityDir.get().file('testhub-build.properties').asFile
        output.parentFile.mkdirs()
        output.withOutputStream { identity.store(it, 'Generated T09 build identity; nanosecond status uses a separate live boot identity') }
    }
}
sourceSets.main.resources.srcDir(hubIdentityDir)
processResources.dependsOn(generateHubBuildIdentity)
jar {
    from('settings.gradle') { into 'backup' }
    from('gradle/wrapper/gradle-wrapper.properties') { into 'backup/gradle/wrapper' }
    from('.wpilib/wpilib_preferences.json') { into 'backup/.wpilib' }
    doLast {
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        archiveFile.get().asFile.withInputStream { stream ->
            byte[] block = new byte[1024 * 1024]
            int count
            while ((count = stream.read(block)) >= 0) digest.update(block, 0, count)
        }
        def report = layout.buildDirectory.file('reports/testhub/artifact-sha256.txt').get().asFile
        report.parentFile.mkdirs()
        report.setText(java.util.HexFormat.of().formatHex(digest.digest()) + '  ' + archiveFile.get().asFile.name + '\n', 'UTF-8')
    }
}


// Create version file
project.compileJava.dependsOn(createVersionFile)
gversion {
    srcDir       = "src/main/java/"
    classPackage = "first.robot"
    className    = "BuildConstants"
    dateFormat   = "yyyy-MM-dd HH:mm:ss z"
    timeZone     = "America/New_York"
    indent       = "  "
}

// Create commit with working changes on event branches
task(eventDeploy) {
    doLast {
        if (project.gradle.startParameter.taskNames.any({ it.toLowerCase().contains("deploy") })) {
            def branchPrefix = "event"
            def branch = 'git branch --show-current'.execute().text.trim()
            def commitMessage = "Update at '${new Date().toString()}'"

            if (branch.startsWith(branchPrefix)) {
                exec {
                    workingDir(projectDir)
                    executable 'git'
                    args 'add', '-A'
                }
                exec {
                    workingDir(projectDir)
                    executable 'git'
                    args 'commit', '-m', commitMessage
                    ignoreExitValue = true
                }

                println "Committed to branch: '$branch'"
                println "Commit message: '$commitMessage'"
            } else {
                println "Not on an event branch, skipping commit"
            }
        } else {
            println "Not running deploy task, skipping commit"
        }
    }
}
createVersionFile.dependsOn(eventDeploy)

// Spotless formatting
project.compileJava.dependsOn(spotlessApply)
spotless {
    // Repository files are LF; platform-native endings would mark every Windows build dirty.
    lineEndings = com.diffplug.spotless.LineEnding.UNIX
    java {
        target fileTree(".") {
            include "**/*.java"
            exclude "**/build/**", "**/build-*/**"
        }
        toggleOffOn()
        googleJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
    groovyGradle {
        target fileTree(".") {
            include "**/*.gradle"
            exclude "**/build/**", "**/build-*/**"
        }
        greclipse()
        leadingTabsToSpaces(4)
        trimTrailingWhitespace()
        endWithNewline()
    }
    json {
        target fileTree(".") {
            include "**/*.json"
            exclude "**/build/**", "**/build-*/**", ".wpilib/**"
        }
        gson().indentWithSpaces(2)
    }
    format "misc", {
        target fileTree(".") {
            include "**/*.md", "**/.gitignore"
            exclude "**/build/**", "**/build-*/**"
        }
        trimTrailingWhitespace()
        leadingTabsToSpaces(2)
        endWithNewline()
    }
}
