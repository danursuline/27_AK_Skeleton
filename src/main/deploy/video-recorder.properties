# USB video recorder configuration (see docs/video-recorder.md).
# Deployed to /home/systemcore/deploy/video-recorder.properties.
# Unknown keys are rejected so typos are reported instead of silently ignored.

# Master switch.
enabled=true
# Record automatically while the robot is enabled.
autoRecordWhenEnabled=true
# Recording is blocked while connected to FMS unless this is set to true.
# Only enable after validating CPU/USB/storage behavior on your robot.
allowRecordingWithFms=false

# Camera device. "auto" selects a camera only when exactly one USB capture
# device is present. Otherwise set an explicit path, preferably a stable
# /dev/v4l/by-id/usb-...-video-index0 link (not /dev/videoN).
device=auto

# FFmpeg executable: a name searched on PATH, or an absolute path.
ffmpegPath=ffmpeg

# Capture mode requested from the camera. The camera must support it.
# MJPEG: compressed frames are stream-copied (no decode/re-encode).
# YUYV: raw frames are software-encoded to MJPEG. Higher CPU cost; benchmark
#       on SystemCore before relying on it. Never selected automatically.
inputFormat=MJPEG
width=640
height=480
fps=30

# Only used when inputFormat=YUYV: MJPEG quality (2=best/largest, 31=worst)
# and the encoder pixel format.
rawEncodeQuality=5
rawEncodePixelFormat=yuvj422p

# Output: MJPEG video in Matroska (.mkv) segments.
segmentSeconds=10
# A session stops (and stays stopped until the request is released and
# re-armed) after this many seconds or this many MiB.
maxSessionSeconds=180
maxSessionMiB=512

outputDirectory=/home/systemcore/videos
# Total space the recorder's own sessions may occupy.
poolMiB=2048
# Never start (and stop) recording if filesystem free space would drop below this.
minFreeMiB=1024

# Timing (seconds).
retryIntervalSeconds=5
maxRetryBackoffSeconds=60
startupTimeoutSeconds=10
stallTimeoutSeconds=5
heartbeatTimeoutSeconds=1.0
stopTimeoutSeconds=3
